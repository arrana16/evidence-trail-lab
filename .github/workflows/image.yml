name: Build and verify OpenEnv image

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE: ghcr.io/arrana16/evidence-trail-lab:v1
      DOCKER_DEFAULT_PLATFORM: linux/amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned OpenEnv and test tools
        run: python -m pip install -e . pytest
      - name: Verify generator and reward
        run: python -m pytest -q
      - name: Build image through OpenEnv
        run: openenv build -t "$IMAGE"
      - name: Check image architecture
        run: test "$(docker image inspect "$IMAGE" --format '{{.Architecture}}')" = amd64
      - name: Start built image
        run: docker run --rm -d --name evidence-trail-test -p 8000:8000 "$IMAGE"
      - name: Wait for health
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs evidence-trail-test
          exit 1
      - name: Validate OpenEnv and replay every task
        run: |
          openenv validate --url http://localhost:8000
          python scripts/replay.py http://localhost:8000
      - name: Stop test image
        if: always()
        run: docker stop evidence-trail-test || true
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        run: docker push "$IMAGE"

